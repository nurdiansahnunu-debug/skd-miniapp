<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>SKD Penawaran &amp; HPP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#E6EBF1;--sl:#FFFFFF;--sd:#B6C1CF;--line:rgba(110,125,145,.16);--tx:#14202E;--mu:#526072;--ok:#137443;--okbg:#D8EEE1;--bad:#AD1F27;--badbg:#F5DADC;--info:#1C5893;--infobg:#D9E6F4;
--p:#0B2A4A;--cta:#D7222B;--pg:#3A5573;--cg:#E0565D;--bp:#0B2A4A;--ba:#E62A33;
--r1:8px 8px 18px var(--sd),-8px -8px 18px var(--sl);--r2:4px 4px 10px var(--sd),-4px -4px 10px var(--sl);
--in:inset 4px 4px 9px var(--sd),inset -4px -4px 9px var(--sl);--in2:inset 2px 2px 5px var(--sd),inset -2px -2px 5px var(--sl)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:box-shadow .15s,transform .1s}
button:focus-visible,input:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
.top{margin:12px 12px 4px;border-radius:22px;background:linear-gradient(145deg,var(--pg),var(--p));color:#fff;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;flex:none;box-shadow:0 12px 24px -10px rgba(11,42,74,.7),inset 0 1px 0 rgba(255,255,255,.18),inset 0 -3px 0 var(--ba)}
.top .t{flex:1;min-width:0}
.top .t b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t span{font-size:12px;opacity:.88}
.bsw{display:flex;align-items:center;gap:4px;height:46px;padding:0 8px 0 5px;border:0;border-radius:14px;background:rgba(255,255,255,.14);color:#fff;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 4px 10px rgba(0,0,0,.15)}
.bsw:active{box-shadow:inset 0 2px 6px rgba(0,0,0,.25)}
.bsw[disabled]{cursor:default}
.logo{width:36px;height:36px;border-radius:11px;background:#fff;color:var(--bp);font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;letter-spacing:.3px;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.18)}
main{flex:1;overflow-y:auto;padding:14px 16px 22px}
h2{font-size:20px;font-weight:800;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--mu);margin:2px 0 16px}
.card{background:var(--bg);border-radius:22px;padding:16px;margin-bottom:16px;box-shadow:var(--r1)}
.card h3{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 small{font-size:12px;font-weight:600;color:var(--mu);padding:3px 9px;border-radius:999px;box-shadow:var(--in2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.stat{background:var(--bg);border-radius:20px;padding:14px;box-shadow:var(--r1)}
.stat span{font-size:12px;color:var(--mu)}
.stat b{display:block;font-size:22px;margin-top:4px;color:var(--p)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:56px;padding:10px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.row:last-child{border-bottom:0}
.row .l{min-width:0;flex:1}
.row .l b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .l span{display:block;font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;font-size:14px;font-weight:700;white-space:nowrap}
.empty{text-align:center;font-size:13px;color:var(--mu);padding:16px 8px;line-height:1.5}
.note{font-size:12px;color:var(--mu);text-align:center;line-height:1.5;margin-top:4px}
.chip{display:inline-block;font-size:11px;font-weight:700;border-radius:7px;padding:2px 8px;background:var(--infobg);color:var(--info)}
.search{position:relative;margin-bottom:14px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mu);pointer-events:none}
.search input{width:100%;height:48px;border:0;border-radius:14px;padding:0 14px 0 42px;font-size:15px;background:var(--bg);box-shadow:var(--in)}
.search input:focus{outline:2px solid rgba(11,42,74,.45);outline-offset:0}
.chips{display:flex;gap:10px;overflow-x:auto;margin:0 -16px 10px;padding:6px 16px 10px}
.chips button{border:0;background:var(--bg);border-radius:999px;min-height:40px;padding:0 16px;font-size:13px;font-weight:700;white-space:nowrap;flex:none;box-shadow:var(--r2);color:#36424F}
.chips button.on{background:linear-gradient(145deg,var(--pg),var(--p));color:#fff;box-shadow:0 6px 12px -5px rgba(11,42,74,.7)}
.prod{width:100%;text-align:left;border:0;background:var(--bg);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:var(--r2);display:block}
.prod .h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.prod .h b{font-size:15px}
.prod .h span{font-size:12px;color:var(--mu)}
.prod.open{box-shadow:var(--in)}
.kats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.kat{border:0;text-align:left;background:var(--bg);border-radius:18px;padding:14px;min-height:84px;box-shadow:var(--r2);display:flex;flex-direction:column;justify-content:space-between;gap:8px;color:var(--tx)}
.kat b{font-size:14px;line-height:1.3}
.kat span{font-size:12px;color:var(--mu)}
.kat:active{box-shadow:var(--in)}
.kembali{border:0;background:var(--bg);border-radius:999px;min-height:40px;padding:0 16px 0 12px;font-size:13px;font-weight:700;box-shadow:var(--r2);color:#36424F;display:inline-flex;align-items:center;gap:8px;margin-bottom:12px}
.judul-kat{font-size:13px;color:var(--mu);margin:0 0 12px}
.rw{width:100%;text-align:left;border:0;background:var(--bg);border-radius:18px;padding:13px 14px;margin-bottom:12px;box-shadow:var(--r2);display:block;color:var(--tx)}
.rw:active{box-shadow:var(--in)}
.rw .a{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rw .a b{font-size:14px;display:block}
.rw .a span{font-size:12px;color:var(--mu)}
.rw .a .r{font-size:14px;font-weight:800;white-space:nowrap;color:var(--p)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tg{font-size:11px;font-weight:700;border-radius:7px;padding:3px 8px;background:var(--infobg);color:var(--info)}
.tg.ok{background:var(--okbg);color:var(--ok)}
.tg.wait{background:#F6EBD3;color:#8A5A00}
.tg.mu{background:rgba(110,125,145,.14);color:var(--mu)}
.rinci{border-radius:18px;padding:12px 14px;box-shadow:var(--in);margin-bottom:14px}
.rinci .tot{font-size:13px}
.aks{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 14px;border:0;border-radius:18px;background:var(--bg);text-align:left;margin-bottom:10px;box-shadow:var(--r2);color:var(--tx)}
.aks:active{box-shadow:var(--in)}
.aks i{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--p);box-shadow:inset 2px 2px 5px var(--sd),inset -2px -2px 5px rgba(255,255,255,.7)}
.aks .l{flex:1;min-width:0}.aks .l b{display:block;font-size:14px}.aks .l span{display:block;font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aks.utama i{background:linear-gradient(145deg,var(--cg),var(--cta));color:#fff;box-shadow:0 6px 12px -6px rgba(215,34,43,.8)}
.sec2{font-size:12px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.4px;margin:14px 2px 8px}
.var{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.var:first-of-type{margin-top:14px}
.var .vn{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700}
.var .vn span{font-weight:500;color:var(--mu)}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.tier{border-radius:12px;padding:8px 4px;text-align:center;box-shadow:var(--r2)}
.tier small{display:block;font-size:11px;color:var(--mu);font-weight:700}
.tier b{font-size:13px}
.tier.aman{background:linear-gradient(145deg,var(--pg),var(--p));color:#fff;box-shadow:0 6px 12px -6px rgba(11,42,74,.7)}
.tier.aman small{color:rgba(255,255,255,.88)}
nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg);margin:0 12px calc(12px + env(safe-area-inset-bottom));border-radius:24px;padding:6px;flex:none;box-shadow:var(--r1)}
nav button{border:0;background:none;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;justify-content:center;border-radius:18px}
nav button i{width:46px;height:32px;border-radius:12px;display:flex;align-items:center;justify-content:center}
nav button.on{color:var(--p);font-weight:800}
nav button.on i{background:linear-gradient(145deg,color-mix(in srgb,var(--cta) 22%,var(--bg)),color-mix(in srgb,var(--p) 14%,var(--bg)));box-shadow:inset 2px 2px 5px var(--sd),inset -2px -2px 5px rgba(255,255,255,.7)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 22px;border:0;border-radius:18px;background:var(--bg);color:var(--p);font-weight:800;font-size:15px;box-shadow:var(--r1)}
.btn:active{box-shadow:var(--in)}
.btn i{width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,var(--cg),var(--cta));color:#fff;display:flex;align-items:center;justify-content:center;margin-left:-12px}
.layar{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;height:100%;padding:32px}
.layar b{font-size:18px}
.layar p{font-size:14px;color:var(--mu);line-height:1.5;max-width:320px}
.putar{width:36px;height:36px;border-radius:50%;border:3px solid var(--sd);border-top-color:var(--p);animation:putar .8s linear infinite}
@keyframes putar{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(20,32,46,.45);display:none;align-items:flex-end;z-index:20}
.modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;margin:0 auto;max-height:85%;border-radius:28px 28px 0 0;overflow-y:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{font-size:17px;margin-bottom:14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;border:0;border-radius:18px;background:var(--bg);text-align:left;margin-bottom:12px;box-shadow:var(--r2)}
.opt.on{box-shadow:var(--in);outline:2px solid rgba(230,42,51,.55);outline-offset:-2px}
.opt .ico-baru{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:linear-gradient(145deg,var(--cg),var(--cta));color:#fff;flex:none;box-shadow:0 6px 12px -6px rgba(215,34,43,.8)}
.opt .l{flex:1}.opt .l b{display:block;font-size:14px}.opt .l span{font-size:12px;color:var(--mu)}
.dot{width:30px;height:30px;border-radius:10px;flex:none;box-shadow:0 3px 6px rgba(0,0,0,.2)}
.pill{min-height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--bg);font-size:14px;font-weight:700;box-shadow:var(--r2);color:#36424F}
.pill.on{background:linear-gradient(145deg,var(--pg),var(--p));color:#fff;box-shadow:0 6px 12px -5px rgba(11,42,74,.7)}
.pills{display:flex;flex-wrap:wrap;gap:10px;padding:2px}
.sec{font-size:12px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 10px}
.fld{display:block;font-size:13px;font-weight:600;color:#36424F;margin:12px 0 6px}
.inp{width:100%;height:48px;border:0;border-radius:14px;padding:0 14px;font-size:15px;background:var(--bg);box-shadow:var(--in)}
.inp:focus{outline:2px solid rgba(11,42,74,.45);outline-offset:0}
textarea.inp{height:auto;min-height:70px;padding:12px 14px;resize:vertical}
.money{position:relative}.money:before{content:"Rp";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px;font-weight:700;color:var(--mu);pointer-events:none;z-index:1}.money .inp{padding-left:40px}
.add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:18px;background:var(--bg);color:var(--p);font-weight:800;font-size:14px;box-shadow:var(--r2)}
.add:active{box-shadow:var(--in)}
.item{border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--in)}
.item .h{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:700}
.item .m{font-size:12px;color:var(--mu);margin:3px 0 10px;line-height:1.45}
.item .a{display:flex;gap:8px}
.lnk{min-height:40px;padding:0 14px;border:0;border-radius:12px;background:var(--bg);color:var(--p);font-weight:700;font-size:13px;box-shadow:var(--r2)}
.lnk.del{color:var(--bad)}
.tot{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;color:#36424F}
.tot.big{font-size:18px;font-weight:800;color:var(--tx);border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:58px;border:0;background:none;text-align:left;padding:6px 0}
.tog .l b{display:block;font-size:14px}.tog .l span{font-size:12px;color:var(--mu)}
.sw{width:52px;height:30px;border-radius:999px;background:var(--bg);position:relative;flex:none;box-shadow:var(--in)}
.sw:after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:var(--bg);top:4px;left:4px;transition:left .18s;box-shadow:2px 2px 5px var(--sd),-1px -1px 3px var(--sl)}
.tog[aria-pressed="true"] .sw{background:linear-gradient(145deg,var(--pg),var(--p))}
.tog[aria-pressed="true"] .sw:after{left:26px;background:#fff}
.kirim{display:flex;justify-content:center;margin-top:6px}
.btn.utama i{background:linear-gradient(145deg,var(--cg),var(--cta))}
.warn{font-size:13px;border-radius:14px;padding:12px 14px;margin:10px 0;line-height:1.45;background:var(--badbg);color:var(--bad)}
.info{font-size:13px;border-radius:14px;padding:12px 14px;margin:10px 0;line-height:1.45;background:var(--infobg);color:var(--info)}
.sheet .sf{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--bg);padding:12px 0 4px;margin-top:8px}
.btnw{width:100%;min-height:52px;border:0;border-radius:18px;background:linear-gradient(145deg,var(--cg),var(--cta));color:#fff;font-weight:800;font-size:16px;box-shadow:0 12px 22px -8px rgba(215,34,43,.6)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="layar"><div class="putar" role="status" aria-label="Memuat"></div><p>Memuat data…</p></div>
</div>
<div class="modal" id="modal"><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>

<script>
/*
 * Mini App SKD Penawaran & HPP · tahap 2 (lihat data + buat penawaran)
 * © 2026 Sinergi Karya Digital
 * Halaman ini tidak menyimpan data atau kunci. Data diambil dari web app Apps Script; akses dicek
 * dari tanda tangan Telegram (initData, atau ?t= dari tombol menu bawah) dan tab pengguna, sama dengan bot.
 * Penawaran dikirim ke bot lewat Telegram.WebApp.sendData; bot menghitung ulang HPP, lalu menampilkan
 * preview di chat. Simpan, nomor dan PDF tetap dibuat bot dengan template yang sama.
 */
var API = 'https://script.google.com/macros/s/AKfycbzCLdShXF0Rpa7snjQtbBF8exjqtRf7JcJfDrwpA51DCFJJZdQS3XmwNNXFmnCfPhTL/exec';
var tg = window.Telegram && window.Telegram.WebApp;
var D = null;
var S = { rq: '', rf: 'semua', brand: '', tab: 'home', cat: '', q: '', cq: '', buka: '' };
var Q = null; // draft penawaran
var F = null; // item yang sedang diisi di panel

var IC = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  quote: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M9 14h6M12 11v6"/>',
  box: '<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  chev: '<path d="M6 9l6 6 6-6"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  chat: '<path d="M4 5h16v11H8l-4 4z"/>',
  retry: '<path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  hist: '<path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/><path d="M12 8v4l3 2"/>',
  rcpt: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  truck: '<path d="M3 6h11v10H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  tag: '<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  pdf: '<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 13h6M9 17h4"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  palet: '<path d="M12 3a9 9 0 1 0 0 18c1 0 1.5-.8 1.2-1.7-.4-1.1.3-2.3 1.5-2.3H17a4 4 0 0 0 4-4c0-5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/>',
  grid: '<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>',
  send: '<path d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/>'
};
function ic(k, s, w) { return '<svg width="' + (s || 22) + '" height="' + (s || 22) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (w || 1.9) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + IC[k] + '</svg>'; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function rp(n) { return 'Rp' + Math.round(n || 0).toLocaleString('id-ID'); }
function angka(v) { var n = parseInt(String(v == null ? '' : v).replace(/\D/g, ''), 10); return isNaN(n) ? 0 : n; }
function desimal(v) { var n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isNaN(n) || n < 0 ? 0 : n; }
function hargaJual(hpp, p10) { return Math.ceil(hpp * (1000 + p10) / 1000); }
function saranJasa(modal) { return modal > 0 ? Math.ceil(modal / 0.65 / 500) * 500 : 0; }
function tgl(iso) { if (!iso) return ''; var d = new Date(iso + 'T00:00:00'); return isNaN(d) ? iso : d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }); }

function muat() {
  // tombol menu bawah bot tidak membawa initData; bot menandatangani alamatnya (?t=...)
  var t = (new URLSearchParams(location.search)).get('t') || '';
  if (!tg || (!tg.initData && !t)) {
    layar('Buka dari Telegram', 'Aplikasi ini hanya bisa dibuka dari tombol "📱 Aplikasi" di menu bawah bot SKD Penawaran & HPP.');
    return;
  }
  $('app').innerHTML = '<div class="layar"><div class="putar" role="status" aria-label="Memuat"></div><p>Memuat data…</p></div>';
  fetch(API, { method: 'POST', body: JSON.stringify({ mini: 'awal', initData: tg.initData || '', t: t }) })
    .then(function (r) { return r.json(); })
    .then(function (h) {
      if (!h || !h.ok) throw new Error(h && h.error ? h.error : 'Gagal memuat data.');
      D = h.data;
      S.brand = (D.brands[0] || {}).kode || '';
      Q = draftBaru();
      render();
    })
    .catch(function (err) {
      layar('Belum bisa dibuka', String(err && err.message || err), '<button class="btn" data-act="muat"><i>' + ic('retry', 18, 2.2) + '</i>Coba lagi</button>');
    });
}

// Penanda brand (garis bawah header & titik di pilihan perusahaan). Kolom warna di tab perusahaan dipakai
// kalau diisi; kalau kosong pakai palet ini supaya tiap brand beda. Warna tema aplikasi tetap SKD.
var WARNA_BRAND = { JSG: '#F5A623', SKD: '#2FB36B', JTG: '#1FA7B5', TDT: '#9B6BF0', AVD: '#EC5FA0', RKD: '#FF7A1A', RFS: '#3D8BFF', JDI: '#C9A14A' };
var WARNA_CADANGAN = ['#F5A623', '#2FB36B', '#1FA7B5', '#9B6BF0', '#EC5FA0', '#FF7A1A', '#3D8BFF', '#C9A14A'];
function warnaBrand(b) {
  if (!b) return '#E62A33';
  if (/^#[0-9a-f]{6}$/i.test(b.warna || '')) return b.warna;
  if (WARNA_BRAND[b.kode]) return WARNA_BRAND[b.kode];
  var h = 0;
  for (var i = 0; i < b.kode.length; i++) h = (h * 31 + b.kode.charCodeAt(i)) % 997;
  return WARNA_CADANGAN[h % WARNA_CADANGAN.length];
}

/* ---------- hitung perkiraan (harga pasti dihitung bot) ---------- */
/** Produk yang HPP-nya masih 0 di semua kain & varian (mis. produk baru dari admin). Kosong kalau data HPP belum termuat. */
function produkTanpaHpp() {
  if (!D.hpp || !Object.keys(D.hpp).length) return [];
  return D.produk.filter(function (p) {
    var H = dataHpp(p);
    if (!H || !H.v) return true;
    return Object.keys(H.v).every(function (k) { return H.v[k].every(function (x) { return !x[0]; }); });
  }).map(function (p) { return p.nama; });
}
function dataHpp(p) { return p && D.hpp ? D.hpp[p.nama.replace(/\s+/g, ' ').trim().toLowerCase()] : null; }
/** Nilai 1 kain: [eceran, rollan, qty minimal rollan] -> HPP untuk qty itu (aturan sama dengan bot). */
function hppKain(x, qty) { if (!x) return 0; if (typeof x === 'number') return x; return x[2] && qty >= x[2] ? x[1] : x[0]; }
/**
 * HPP item dari bot (rumus sama dengan chat): per model|ukuran, per kain, rollan otomatis bila qty capai minimal.
 * Kain belum dipilih: kain termahal (sama dengan bot). Hasil {hpp, x (nilai kain terpilih) }.
 */
function infoHpp(it) {
  var H = dataHpp(produk(it.p));
  if (!H) return { hpp: 0, x: null };
  H.m = H.m || []; H.u = H.u || [];
  var m = (it.m || '').toLowerCase(), u = (it.u || '').toLowerCase();
  var baris = H.v[m + '|' + u] || H.v[m + '|'] || H.v['|' + u] || H.v['|'];
  if (!baris) return { hpp: 0, x: null };
  var qty = angka(it.q), ki = -1, kn = (it.kn || '').toLowerCase();
  for (var i = 0; i < H.k.length; i++) if (H.k[i].toLowerCase() === kn) ki = i;
  if (H.k.length === 1) ki = 0;
  if (ki >= 0) return { hpp: hppKain(baris[ki], qty), x: typeof baris[ki] === 'number' ? null : baris[ki] };
  var best = 0;
  baris.forEach(function (x) { best = Math.max(best, hppKain(x, qty)); });
  return { hpp: best, x: null };
}
function hppItem(it) { return infoHpp(it).hpp; }
/** Keterangan HPP di form: rollan aktif / mulai qty berapa. */
function ketHpp(it) {
  var f = infoHpp(it), x = f.x, qty = angka(it.q);
  if (!f.hpp) return '';
  if (!x || !x[2] || x[1] >= x[0]) return 'HPP ' + rp(f.hpp);
  return qty >= x[2] ? 'HPP ' + rp(f.hpp) + ' (harga Rollan)' : 'HPP ' + rp(f.hpp) + ' · Rollan ' + rp(x[1]) + ' mulai ' + x[2] + ' pcs';
}
function hargaItem(it) { var h = angka(it.h); if (h) return h; var hpp = hppItem(it); return hpp ? hargaJual(hpp, it.t) : 0; }
function hargaJasaItem(it) { if (!it.j) return 0; return angka(it.j.h) || saranJasa((D.jasa[it.j.j] || {})[it.j.u] || 0); }
function totalItem(it) { return (hargaItem(it) + hargaJasaItem(it)) * angka(it.q); }
function subtotal() { return Q.items.reduce(function (n, it) { return n + totalItem(it); }, 0); }
function diskon() {
  var t = subtotal();
  if (Q.dk.mode === 'p') return Math.round(t * Math.min(desimal(Q.dk.v), 100) / 100);
  if (Q.dk.mode === 'n') return Math.min(angka(Q.dk.v), Math.max(0, t - 1));
  return 0;
}

/** Produk dikelompokkan per kategori: pilih kategori dulu; pencarian mencari di semua kategori. */
function daftarProduk() {

    var cats = [], jml = {};
    D.produk.forEach(function (p) { if (!jml[p.kategori]) { jml[p.kategori] = 0; cats.push(p.kategori); } jml[p.kategori]++; });

  }).join('');

function rentangHpp(x) { if (typeof x === 'number') x = [x, x, 0]; if (!x || !x[0]) return '–'; return x[2] && x[1] < x[0] ? rp(x[1]) + ' – ' + rp(x[0]).replace('Rp', '') : rp(x[0]); }
function tiersHpp(hpp) {
  return '<p class="note" style="text-align:left;margin:8px 0 0">Harga jual / pcs</p><div class="tiers" style="margin-top:4px">' + D.markup.map(function (m) {
    return '<div class="tier' + (m.label === 'Aman' ? ' aman' : '') + '"><small>' + esc(m.label) + '</small><b>' + rp(hargaJual(hpp, m.p10)) + '</b></div>';
  }).join('') + '</div>';
}
/**
 * Rincian HPP 1 produk dari bot, sama dengan /hpp di chat: per kain rentang Rollan – eceran,
 * harga acuan jual dari HPP eceran. Varian (model / ukuran) masing-masing ditampilkan sendiri.
 */
function rincianHpp(p) {
  var H = dataHpp(p);
  if (!H || !H.v['|']) return '<div class="var"><div class="note" style="text-align:left">HPP belum tersedia. Cek lewat /hpp di bot.</div></div>';
  var adaRollan = false;
  var blokKain = function (baris, ringkas) {
    return H.k.map(function (k, i) {
      var x = typeof baris[i] === 'number' ? [baris[i], baris[i], 0] : baris[i];
      if (x && x[2] && x[1] < x[0]) adaRollan = true;
      var kepala = '<div class="vn">' + esc(k || 'HPP') + '<span>HPP ' + rentangHpp(x) + '</span></div>';
      if (!x || !x[0]) return '<div class="var">' + kepala + '<div class="note" style="text-align:left">Harga kain ini belum diisi di Sheet.</div></div>';
      if (ringkas) return '<div class="var" style="margin-top:8px;padding-top:8px">' + kepala + '<div class="note" style="text-align:left">Jual/pcs: ' + D.markup.map(function (m) { return esc(m.label) + ' ' + rp(hargaJual(x[0], m.p10)); }).join(' · ') + '</div></div>';
      return '<div class="var">' + kepala + tiersHpp(x[0]) + '</div>';
    }).join('');
  };
  var varian = (H.m || []).map(function (n) { return [n, n.toLowerCase() + '|']; }).concat((H.u || []).map(function (n) { return [n, '|' + n.toLowerCase()]; }));
  var isi = varian.length
    ? varian.map(function (v) { var b = H.v[v[1]]; return b ? '<div class="var"><b style="font-size:13px">' + esc(v[0]) + '</b>' + blokKain(b, true) + '</div>' : ''; }).join('')
    : blokKain(H.v['|'], false);
  return isi + '<p class="note" style="text-align:left;margin-top:10px">HPP: harga Rollan – eceran. Harga acuan dari HPP eceran.' + (adaRollan ? ' Rollan dipakai otomatis bila pesanan capai minimal.' : '') + '</p>';
}

/* ---------- riwayat (data dari bot: aturan revisi & invoice sama dengan chat) ---------- */
function cariRiwayat(no) {
  var l = D.riwayat ? (D.riwayat[S.brand] || []) : [];
  for (var i = 0; i < l.length; i++) if (l[i].no === no) return l[i];
  return null;

function lunasDiMuka(r) { return !r.pl; }
function sudahLunas(r) { return lunasDiMuka(r) ? Boolean(r.d) : Boolean(r.l); }
function tagRiwayat(r) {
  var t = [];
  if (lunasDiMuka(r)) t.push(r.d ? ['ok', 'Lunas di muka'] : ['mu', 'Belum ditagih']);
  else if (r.l) t.push(['ok', 'Lunas']);
  else if (r.d) t.push(r.x ? ['mu', 'DP ' + r.dpp + '% · tidak lanjut'] : ['wait', 'DP ' + r.dpp + '% · belum lunas']);
  else t.push(['mu', 'Belum DP']);
  if (r.s === 'diproses') t.push(['wait', 'Produksi' + (r.dl ? ' · ' + tgl(r.dl) : '')]);
  else if (r.s === 'siap') t.push(['ok', 'Siap kirim']);
  else if (r.s === 'dikirim' || r.sj) t.push(['ok', 'Dikirim']);
  if (r.r) t.push(['', 'Revisi']);
  return '<div class="tags">' + t.map(function (x) { return '<span class="tg ' + x[0] + '">' + esc(x[1]) + '</span>'; }).join('') + '</div>';
}
function daftarRiwayat() {
  var q = S.rq.trim().toLowerCase();
  var l = (D.riwayat[S.brand] || []).filter(function (r) {
    if (q && (r.c + ' ' + r.no).toLowerCase().indexOf(q) < 0) return false;
    if (S.rf === 'belum') return !r.d;
    if (S.rf === 'dp') return Boolean(r.d) && !sudahLunas(r);
    if (S.rf === 'lunas') return sudahLunas(r);

  if (!l.length) return '<div class="empty">' + (q || S.rf !== 'semua' ? 'Tidak ada penawaran yang cocok.' : 'Belum ada penawaran untuk perusahaan ini.') + '</div>';

  return h + '<p class="note" style="margin-top:6px">Setelah tombol ditekan, aplikasi tertutup dan bot melanjutkan di chat.</p>';

    (models.length ? '<div class="sec" style="margin-top:0">Model</div>' + pills(models, 'm', false) : '') +
    (ukuran.length ? '<div class="sec">Ukuran</div>' + pills(ukuran, 'u', true) : '') +
    (p.kain.length > 1 ? '<div class="sec">Jenis kain</div><div class="pills">' + p.kain.map(function (k) { var on = F.kn === k; return '<button class="pill' + (on ? ' on' : '') + '" data-act="fSet" data-arg="kn|' + esc(k) + '" aria-pressed="' + on + '">' + esc(k) + '</button>'; }).join('') + '</div>' : '') +
    '<label class="fld" for="fW">Warna</label><input class="inp" id="fW" data-in="fW" value="' + esc(F.w) + '" maxlength="60" placeholder="Contoh: Putih">' +
    '<label class="fld" for="fQ">Jumlah</label><input class="inp" id="fQ" data-in="fQ" value="' + esc(F.q) + '" inputmode="numeric" placeholder="Contoh: 100">' +
    '<div id="fHarga">' + seksiHarga() + '</div>' +
    jasa +
    '<div class="sf"><button class="btnw" data-act="simpanItem">' + (S.fIdx >= 0 ? 'Simpan perubahan' : 'Tambahkan ke penawaran') + '</button></div>';
}

function seksiHarga() {
  var hpp = hppItem(F), ket = ketHpp(F);
  return '<div class="sec">Harga jual / pcs</div>' + (ket ? '<p class="note" style="text-align:left;margin:-4px 0 8px">' + esc(ket) + '</p>' : '') +
    (hpp ? '<div class="tiers" style="margin-bottom:10px">' + D.markup.map(function (m) {
      var on = !angka(F.h) && F.t === m.p10;
      return '<button class="tier' + (on ? ' aman' : '') + '" style="border:0;background:' + (on ? '' : 'var(--bg)') + '" data-act="fTier" data-arg="' + m.p10 + '" aria-pressed="' + on + '"><small>' + esc(m.label) + '</small><b>' + rp(hargaJual(hpp, m.p10)) + '</b></button>';
    }).join('') + '</div>' : '<div class="info">HPP belum ada, isi harga jual manual.</div>') +
    '<div class="money"><input class="inp" id="fH" data-in="fH" value="' + esc(F.h) + '" inputmode="numeric" placeholder="' + (hpp ? 'Harga lain sesuai kesepakatan' : 'Harga jual per satuan') + '" aria-label="Harga lain"></div>';
}

/* ---------- kirim ---------- */
function custPesanan() {
  var c = Q.cust;
  return c.mode === 'lama' ? { n: c.nama, up: c.up, k: c.k, a: c.a, lama: true } : { n: c.n.trim(), up: c.up.trim(), k: c.k.trim(), a: c.a.trim() };
}
function kirimData(data) {
  var teks = JSON.stringify(data);
  if (new Blob([teks]).size > 4000) return pesan('Penawaran terlalu panjang untuk dikirim sekaligus. Kurangi jumlah produk atau catatan.');
  if (tg.initDataUnsafe && tg.initDataUnsafe.query_id) return pesan('Untuk mengirim penawaran, buka aplikasi dari tombol "📱 Aplikasi" di menu bawah chat bot.');
  try { tg.sendData(teks); } catch (e) { pesan('Gagal mengirim: ' + (e && e.message || e)); }
}
function kirim() {
  var cust = custPesanan();
  if (!cust.n || cust.n.length < 2) return pesan('Pilih atau isi nama customer dulu.');
  if (!cust.k) return pesan('No. WhatsApp / telepon customer wajib diisi.');
  if (!Q.items.length) return pesan('Tambahkan minimal 1 produk.');
  var lp = Q.lp === 'lain' ? Q.lpLain.trim() : Q.lp;
  if (!lp) return pesan('Pilih lama pengerjaan.');
  var dp = Q.dp === 'lain' ? angka(Q.dpLain) : Q.dp;
  if (!(dp >= 1 && dp <= 100)) return pesan('Persen DP harus 1–100.');
  if ((Q.og.j === 'subsidi' || Q.og.j === 'penuh') && !angka(Q.og.n)) return pesan('Isi ongkos kirim asli.');
  kirimData(susunPesanan(cust, lp, dp));
}
/** Isi penawaran di aplikasi jadi data untuk bot. Dipakai kirim biasa dan produk baru (yang kosong ditanya bot di chat). */
function susunPesanan(cust, lp, dp) {
  var data = {
    v: 1, b: S.brand, c: cust,
    i: Q.items.map(function (it) {
      var o = { p: it.p, q: angka(it.q) };
      if (it.m) o.m = it.m;
      if (it.u) o.u = it.u;
      if (it.kn) o.kn = it.kn;
      if (it.w) o.w = it.w;
      if (angka(it.h)) o.h = angka(it.h); else o.t = it.t;
      if (it.j) { o.j = { j: it.j.j, u: it.j.u }; if (it.j.po) o.j.po = it.j.po; if (angka(it.j.h)) o.j.h = angka(it.j.h); }
      return o;
    }),
    lp: lp, dp: dp
  };
  if (Q.dk.mode === 'p' && desimal(Q.dk.v)) data.dk = { p: desimal(Q.dk.v) };
  if (Q.dk.mode === 'n' && angka(Q.dk.v)) data.dk = { n: angka(Q.dk.v) };
  if (Q.og.j) data.og = { j: Q.og.j, n: angka(Q.og.n) };
  if (Q.ct.trim()) data.ct = Q.ct.trim();
  if (Q.sk) data.sk = true;
  return data;
}
/** Produk belum ada di database: isi penawaran yang sudah ada ikut dibawa, produk baru ditambahkan & dilengkapi di chat. */
function kirimProdukBaru() {
  var nama = (S.ppq || '').replace(/\s+/g, ' ').trim();
  if (nama.length < 3) return pesan('Nama produk minimal 3 huruf.');
  if (nama.length > 80) return pesan('Nama produk maksimal 80 huruf.');
  var cust = custPesanan();
  var lp = Q.lp === 'lain' ? Q.lpLain.trim() : Q.lp;
  var dp = Q.dp === 'lain' ? angka(Q.dpLain) : Q.dp;
  var data = susunPesanan(cust.n && cust.n.length >= 2 ? cust : undefined, lp || undefined, dp >= 1 && dp <= 100 ? dp : undefined);
  data.nb = nama;
  var lanjut = function (ok) { if (ok) kirimData(data); };
  var teks = 'Tambah produk baru "' + nama + '"?\n\nAplikasi ditutup, lalu bot di chat menanyakan kategori, kain, jumlah, dan harga jual (manual). Owner dikabari untuk mengisi HPP.' +
    (Q.items.length ? '\n\n' + Q.items.length + ' produk yang sudah diisi ikut dibawa.' : '');
  try { tg.showConfirm(teks, lanjut); } catch (e) { lanjut(confirm(teks)); }
}

var ACT = {
  muat: muat,
  tab: function (t) { S.tab = t; render(); $('main').scrollTop = 0; },
  lpb: function (k) { S.lpb = Number(k) || 0; var y = $('main').scrollTop; render(); $('main').scrollTop = y; },
  pilihLp: function (k) { if (k !== S.brand) Q.cust = draftBaru().cust; S.brand = k; S.cq = ''; S.rq = ''; render(); $('main').scrollTop = 0; },
  keRiwayat: function (f) { S.tab = 'rw'; S.rf = f || 'semua'; S.rq = ''; render(); $('main').scrollTop = 0; },
  link: function (k) {
    var url = D.link && D.link[k];
    if (!url) return;
    try { tg.openLink(url); } catch (e) { window.open(url, '_blank'); }
  },
  rwF: function (f) { S.rf = f; $('rwlist').innerHTML = daftarRiwayat(); document.querySelectorAll('[data-act=rwF]').forEach(function (b) { var on = b.getAttribute('data-arg') === f; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }); },
  rwBuka: function (no) { buka(panelRiwayat(no)); },
  aksi: function (a) { kirimAksi(a); },
  cat: function (c) { S.cat = c; S.buka = ''; render(); $('main').scrollTop = 0; },
  buka: function (n) { S.buka = S.buka === n ? '' : n; var y = $('main').scrollTop; render(); $('main').scrollTop = y; },
  brand: function () { if (D.brands.length > 1) bukaBrand(); },
  pilih: function (k) {
    if (k !== S.brand) { Q.cust = draftBaru().cust; }
    S.brand = k; S.cq = ''; S.rq = ''; tutupPanel(); render();
  },
  custMode: function (m) { Q.cust.mode = m; ulang(); },
  pilihCust: function () { S.pcq = ''; buka(panelCustomer()); },
  setCust: function (i) {
    var c = (D.customer[S.brand] || [])[+i];
    if (c) { Q.cust.nama = c.nama; Q.cust.up = c.up; Q.cust.k = c.kontak; Q.cust.a = c.alamat; }
    tutupPanel(); ulang();
  },
  tambahItem: function () { S.ppq = ''; S.fIdx = -1; buka(panelProduk()); },
  produkBaru: kirimProdukBaru,
  pilihProduk: function (n) {
    var p = produk(n); if (!p) return;
    F = itemBaru(n);
    var uk = p.varian.filter(function (v) { return v.jenis === 'ukuran'; });
    if (uk.length === 1) F.u = uk[0].nama;
    if (p.kain.length === 1) F.kn = p.kain[0];
    buka(panelItem());
  },
  ubahItem: function (i) { var it = Q.items[+i]; if (!it) return; S.fIdx = +i; F = JSON.parse(JSON.stringify(it)); buka(panelItem()); },
  hapusItem: function (i) { Q.items.splice(+i, 1); ulang(); },
  fSet: function (arg) { var k = arg.split('|')[0], v = arg.slice(k.length + 1); F[k] = F[k] === v && k !== 'u' ? '' : v; segarkanItem(); },
  fTier: function (p10) { F.t = +p10; F.h = ''; segarkanItem(); },
  fJasa: function () { F.j = F.j ? null : { j: 'Sablon', u: 'Kecil', po: /kursi/i.test(F.p) ? 'Sandaran depan' : '', h: '' }; segarkanItem(); },
  jSet: function (arg) { var k = arg.split('|')[0]; F.j[k] = arg.slice(k.length + 1); if (k !== 'po') F.j.h = ''; segarkanItem(); },
  simpanItem: function () {
    var p = produk(F.p);
    if (p.varian.some(function (v) { return v.jenis === 'ukuran'; }) && !F.u) return pesan('Pilih ukuran dulu.');
    if (!angka(F.q)) return pesan('Isi jumlah dulu.');
    if (!hargaItem(F)) return pesan('Isi harga jual dulu.');
    if (F.j && !hargaJasaItem(F)) return pesan('Isi harga sablon/bordir dulu.');
    if (S.fIdx >= 0) Q.items[S.fIdx] = F; else Q.items.push(F);
    F = null; tutupPanel(); ulang();
  },
  lp: function (x) { Q.lp = x === 'Lainnya' ? 'lain' : x; ulang(); },
  dk: function (m) { Q.dk.mode = m; Q.dk.v = ''; ulang(); },
  og: function (j) { Q.og.j = j; ulang(); },
  dp: function (x) { Q.dp = x === 'lain' ? 'lain' : +x; ulang(); },
  sk: function () { Q.sk = !Q.sk; ulang(); },
  kirim: kirim,
  tutup: function () { try { tg.close(); } catch (e) {} }
};

function ulang() { var y = $('main').scrollTop; render(); $('main').scrollTop = y; }
function segarkanItem() { var y = $('sheet').scrollTop; $('sheet').innerHTML = panelItem(); $('sheet').scrollTop = y; }
function segarkanTotal() {
  var t = subtotal(), d = diskon();
  if ($('tSub')) $('tSub').textContent = rp(t);
  if ($('tDk')) $('tDk').textContent = d ? '−' + rp(d) : '–';
  if ($('tTot')) $('tTot').textContent = rp(t - d);
}

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var fn = ACT[el.getAttribute('data-act')];
  if (fn) { haptic(); fn(el.getAttribute('data-arg') || ''); }
});
$('modal').addEventListener('click', function (e) { if (e.target === this) tutupPanel(); });
document.addEventListener('input', function (e) {
  var k = e.target.getAttribute('data-in'), v = e.target.value;
  if (k === 'q') { S.q = v; $('plist').innerHTML = daftarProduk(); }
  else if (k === 'rq') { S.rq = v; $('rwlist').innerHTML = daftarRiwayat(); }
  else if (k === 'cq') { S.cq = v; $('clist').innerHTML = daftarCustomer(); }
  else if (k === 'pcq') { S.pcq = v; var h = document.createElement('div'); h.innerHTML = panelCustomer(); $('pclist').innerHTML = h.querySelector('#pclist').innerHTML; }
  else if (k === 'ppq') { S.ppq = v; var h2 = document.createElement('div'); h2.innerHTML = panelProduk(); $('pplist').innerHTML = h2.querySelector('#pplist').innerHTML; }
  else if (k === 'cN') Q.cust.n = v;
  else if (k === 'cU') Q.cust.up = v;
  else if (k === 'cK') Q.cust.k = v;
  else if (k === 'cA') Q.cust.a = v;
  else if (k === 'lpLain') Q.lpLain = v;
  else if (k === 'dkV') { Q.dk.v = v; segarkanTotal(); }
  else if (k === 'ogN') Q.og.n = v;
  else if (k === 'dpLain') Q.dpLain = v;
  else if (k === 'ct') Q.ct = v;
  else if (k === 'fW') F.w = v;
  else if (k === 'fQ') { F.q = v; if ($('fHarga')) $('fHarga').innerHTML = seksiHarga(); }
  else if (k === 'fH') {
    F.h = v;
    document.querySelectorAll('#sheet [data-act=fTier]').forEach(function (b) { var on = !angka(F.h) && F.t === +b.getAttribute('data-arg'); b.classList.toggle('aman', on); b.style.background = on ? '' : 'var(--bg)'; b.setAttribute('aria-pressed', on); });
  }
  else if (k === 'jH') F.j.h = v;
});

if (tg) {
  try { tg.ready(); tg.expand(); tg.setHeaderColor('#E6EBF1'); tg.setBackgroundColor('#E6EBF1'); } catch (e) {}
}
muat();
</script>
</body>
</html>
